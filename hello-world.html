<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World — MIS 7397 Team 2</title>
  <style>
    :root {
      --uh-red: #C8102E;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --bg: #faf9f7;
      --card: #ffffff;
      --line: #e5e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2f0ed;
        --muted: #a8a29b;
        --bg: #16150f;
        --card: #201f18;
        --line: #34322a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }
    .badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--uh-red);
      border: 1px solid var(--uh-red);
      border-radius: 999px;
      padding: .3rem .7rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(1.9rem, 6vw, 2.75rem);
      letter-spacing: -.02em;
    }
    .wave { display: inline-block; animation: wave 2.2s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20%, 40% { transform: rotate(-8deg); }
    }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    .meta {
      border-top: 1px solid var(--line);
      padding-top: 1.25rem;
      font-size: .85rem;
      color: var(--muted);
    }
    .meta strong { color: var(--ink); font-weight: 600; }
    a { color: var(--uh-red); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">MIS 7397 &middot; Team 2</span>
    <h1>Hello, World! <span class="wave" aria-hidden="true">&#128075;</span></h1>
    <p>First commit to the team repository. If you can read this, the repo is live and everyone can pull it down.</p>
    <div class="meta">
      <strong>Introduction to Artificial Intelligence for Business</strong><br>
      University of Houston &middot; Fall 2026<br>
      <a href="README.md">Read the course overview &rarr;</a>
    </div>
  </main>
</body>
</html>
